name: Bench

on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet filter
        default: "*"
      runtimes:
        description: .NET versions, as a JSON list
        default: '["6.0", "7.0", "8.0", "9.0", "10.0"]'
      runs:
        description: Runs of each, as a JSON list of run numbers
        default: "[1]"

permissions:
  contents: write

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-15]
        runtime: ${{ fromJSON(inputs.runtimes) }}
        run: ${{ fromJSON(inputs.runs) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ matrix.runtime }}.x
            10.0.x
      - name: Run
        shell: bash
        run: |
          mkdir -p out
          dotnet run -c Release -f net${{ matrix.runtime }} --project Bench -- --filter '${{ inputs.filter }}' --artifacts out > out/console.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-net${{ matrix.runtime }}.${{ matrix.run }}
          path: |
            out/console.txt
            out/results

  collect:
    needs: bench
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results/${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add results
          git commit -m "Run ${{ github.run_id }}"
          for attempt in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
